<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #111;
        height: 100%;
    }

    canvas {
        border: 1px solid #d3d3d3;
        background-color: #f1f1f1;
        
        display: block;   
        max-width: 100vw;  
        max-height: 100vh;
        width: 100vw;
        height: auto;
        
        margin: 0 auto;
    }

    </style>
</head>

<body onload="startGame()">

    <script>

        var myGamePiece;
        var myObstacles = [];
        var myScore;

        function startGame() {
            myGamePiece = new component(30, 30, "red", 10, 120);
            myGamePiece.gravity = 0.05;
            myScore = new component("30px", "Consolas", "black", 280, 40, "text");
            myGameArea.start();



        }


        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.frameNo = 0;
                this.interval = setInterval(updateGameArea, 20);
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }



        function drawSprite(sheet, spriteIndex, x, y) {
            const size = 16;
            let columns = Math.floor(sheet.width / size);
            if (columns <= 0) columns = 0;

            // Convert single index into x and y on the sprite sheet
            const sX = (spriteIndex % columns) * size;
            const sY = Math.floor(spriteIndex / columns) * size;

            // Draw 
            ctx = myGameArea.context;
            ctx.drawImage(
                sheet,
                sX, sY, size, size, // Source - where to crop from the sheet
                x, y, 64, 64    // Destination - where to draw it
            );
        }

        function background(width, height) {

            this.backSheet = new Image();
            this.backSheet.src = "neo_zero_tiles_and_buildings_01.png";
            this.loaded = false;
            this.backSheet.onload = () => {
                this.loaded = true;
            }

            this.draw = function () {
                if (this.loaded) {
                    
                    drawSprite(this.backSheet, 12, 10, 10);
                    // ctx.drawImage(this.backSheet, 10, 10);
                    // ctx.drawImage(
                    //     this.backSheet,
                    //     0, 0, 160, 160,  // Source rectangle
                    //     10, 10, 64, 64 // Destination rectangle, enlarged 4x
                    // );
                }
            }

        }

        function component(width, height, color, x, y, type) {
            this.background = new background(width, height);
            this.type = type;
            this.score = 0;
            this.width = width;
            this.height = height;
            this.speedX = 0;
            this.speedY = 0;
            this.x = x;
            this.y = y;
            this.gravity = 0;
            this.gravitySpeed = 0;
            this.update = function () {
                ctx = myGameArea.context;
                // Draw background
                this.background.draw()
                
                // Draw player and text
                if (this.type == "text") {
                    ctx.font = this.width + " " + this.height;
                    ctx.fillStyle = color;
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }


            }
            this.newPos = function () {
                this.gravitySpeed += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY + this.gravitySpeed;
                this.hitBottom();
            }
            this.hitBottom = function () {
                var rockbottom = myGameArea.canvas.height - this.height;
                if (this.y > rockbottom) {
                    this.y = rockbottom;
                    this.gravitySpeed = 0;
                }
            }
            this.crashWith = function (otherobj) {
                var myleft = this.x;
                var myright = this.x + (this.width);
                var mytop = this.y;
                var mybottom = this.y + (this.height);
                var otherleft = otherobj.x;
                var otherright = otherobj.x + (otherobj.width);
                var othertop = otherobj.y;
                var otherbottom = otherobj.y + (otherobj.height);
                var crash = true;
                if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
                    crash = false;
                }
                return crash;
            }
        }

        function updateGameArea() {
            var x, height, gap, minHeight, maxHeight, minGap, maxGap;
            for (i = 0; i < myObstacles.length; i += 1) {
                if (myGamePiece.crashWith(myObstacles[i])) {
                    return;
                }
            }
            myGameArea.clear();
            myGameArea.frameNo += 1;
            if (myGameArea.frameNo == 1 || everyinterval(150)) {
                x = myGameArea.canvas.width;
                minHeight = 20;
                maxHeight = 200;
                height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                minGap = 50;
                maxGap = 200;
                gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);
                myObstacles.push(new component(10, height, "green", x, 0));
                myObstacles.push(new component(10, x - height - gap, "green", x, height + gap));
            }
            for (i = 0; i < myObstacles.length; i += 1) {
                myObstacles[i].x += -1;
                myObstacles[i].update();
            }
            myScore.text = "SCORE: " + myGameArea.frameNo;
            myScore.update();
            myGamePiece.newPos();
            myGamePiece.update();
        }

        function everyinterval(n) {
            if ((myGameArea.frameNo / n) % 1 == 0) { return true; }
            return false;
        }

        function accelerate(n) {
            myGamePiece.gravity = n;
        }

        window.addEventListener('keydown', (event) => {
            if (event.key === 'w' || event.key === 'W') {
                console.log('The w key was pressed!');
                accelerate(-0.2)
            }
        });

        window.addEventListener("keyup", (event) => {
            if (event.key === 's' || event.key === 's') {
                console.log('The S key was pressed!');
                accelerate(0.2)
            }
        });
    </script>
    <br>
</body>

</html>
