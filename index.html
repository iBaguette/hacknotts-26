<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            height: 100%;
        }

        canvas {
            border: 1px solid #d3d3d3;
            background-color: #f1f1f1;

            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: auto;

            margin: 0 auto;
        }
    </style>
</head>

<body onload="startGame()">

    <script>

        var player_piece;
        var myObstacles = [];
        var myScore;

        let x = 0;
        let y = 0;

        // Background is 139
        // StartTile is the index in the map that should be the tile at 0, 0 at the start of the game
        // The start tile is drawn in the middle of the screen initially

        const t = {
            "cracked": 139,
            "slid": 120,
            "blacc": 111
        }

        const startTileX = 1;
        const startTileY = 0;
        const map = [
            [t.cracked, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid],
            [t.cracked, t.slid, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.slid],
            [t.cracked, t.slid, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.slid],
            [t.cracked, t.slid, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.blacc, t.slid],
            [t.cracked, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid, t.slid],
        ];

        function startGame() {
            myScore = new component("30px", "Consolas", "black", 280, 40, "text");
            myGameArea.start();

        }


        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.frameNo = 0;
                this.interval = setInterval(updateGameArea, 20);
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }



        function drawSprite(sheet, spriteIndex, x, y, scale) {
            const size = 16;
            let columns = Math.floor(sheet.width / size);
            if (columns <= 0) columns = 0;

            // Convert single index into x and y on the sprite sheet
            const sX = (spriteIndex % columns) * size;
            const sY = Math.floor(spriteIndex / columns) * size;

            // Draw 
            ctx = myGameArea.context;
            ctx.drawImage(
                sheet,
                sX, sY, size, size, // Source - where to crop from the sheet
                x, y, scale, scale    // Destination - where to draw it
            );
        }

        function background(width, height) {
            const scale = 32;
            this.backSheet = new Image();
            this.backSheet.src = "assets/neo_zero_tiles_and_buildings_01.png";
            this.loaded = false;
            this.backSheet.onload = () => {
                this.loaded = true;
            }

            this.draw = function () {
                if (!this.loaded) return;

                const canvas = myGameArea.canvas;

                // Centre the starting tile on the canvas
                const startScreenX = canvas.width / 2 - scale / 2;
                const startScreenY = canvas.height / 2 - scale / 2;

                // Draw each tile in the map
                for (let row = 0; row < map.length; row++) {
                    for (let col = 0; col < map[row].length; col++) {
                        const spriteIndex = map[row][col];

                        const screenX = startScreenX + (col - startTileX) * scale;
                        const screenY = startScreenY + (row - startTileY) * scale;

                        drawSprite(
                            this.backSheet,
                            spriteIndex,
                            screenX,
                            screenY,
                            scale
                        );
                    }
                }
            };

        }

        function component(width, height, color, x, y, type) {
            this.background = new background(width, height);
            this.type = type;
            this.score = 0;
            this.width = width;
            this.height = height;
            this.x = x;
            this.y = y;
            this.update = function () {
                ctx = myGameArea.context;
                // Draw background
                this.background.draw()

                // Draw different types of stuff
                if (this.type == "text") {
                    // ctx.font = this.width + " " + this.height;
                    // ctx.fillStyle = color;
                    // ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }


            }
            this.newPos = function () {
                this.gravitySpeed += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY + this.gravitySpeed;
                this.hitBottom();
            }
            this.hitBottom = function () {
                var rockbottom = myGameArea.canvas.height - this.height;
                if (this.y > rockbottom) {
                    this.y = rockbottom;
                    this.gravitySpeed = 0;
                }
            }
            this.crashWith = function (otherobj) {
                var myleft = this.x;
                var myright = this.x + (this.width);
                var mytop = this.y;
                var mybottom = this.y + (this.height);
                var otherleft = otherobj.x;
                var otherright = otherobj.x + (otherobj.width);
                var othertop = otherobj.y;
                var otherbottom = otherobj.y + (otherobj.height);
                var crash = true;
                if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
                    crash = false;
                }
                return crash;
            }
        }

        function updateGameArea() {
            var x, height, gap, minHeight, maxHeight, minGap, maxGap;
            // console.log(myObstacles.length)
            // for (i = 0; i < myObstacles.length; i += 1) {
            //     if (player_piece.crashWith(myObstacles[i].component)) {
            //         return;
            //     }
            // }
            myGameArea.clear();
            myGameArea.frameNo += 1;
            if (myGameArea.frameNo == 1 || everyinterval(150)) {
                x = myGameArea.canvas.width;
                minHeight = 20;
                maxHeight = 200;
                height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                minGap = 50;
                maxGap = 200;
                gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);
            }
            for (i = 0; i < myObstacles.length; i += 1) {
                myObstacles[i].x += -1;
                myObstacles[i].update();
            }
            myScore.text = "SCORE: " + myGameArea.frameNo;
            myScore.update();
            
            for (var entity in myObstacles) {
                entity.component.newPos();
                entity.component.update();
            }
        }

        function everyinterval(n) {
            if ((myGameArea.frameNo / n) % 1 == 0) { return true; }
            return false;
        }

        // Manage all characters/entities in the world rn
        /**
         * definition for different character types
         */
        const CharacterType = {
            Player: "player",
            Enemy: "enemy",
            NPC: "npc",
            Item: "item",
            Obstacle: "obstacle",
        }

        var entities = [];
        var current_entity_id = 0;
        function spawnEntity(category = CharacterType.Item, size_x, size_y, colour, position_x, position_y, collidable = true) {

            // Player must be singleton
            if (category === CharacterType.Player) {
                if (player_piece !== undefined) {
                    window.alert("Can't spawn a second player");
                    return;
                }
            }

            // else create the new
            let new_char = new component(size_x, size_y, colour, position_x, position_y);

            const constructed_character = {
                id: current_entity_id++,
                component: new_char,
                category: category,
                size_x: size_x,
                size_y: size_y,
                colour: colour,
                collidable: collidable
            };

            entities.push(constructed_character);
            // console.lwog(`Spawned new character with id: ${current_entity_id}`);

            // set singleton 
            if (category === CharacterType.Player) {
                console.log("Assigned player piece");
                player_piece = constructed_character;
            }

            console.log(`Created entity #${current_entity_id}`);
            console.log(constructed_character);
            return new_char;
        }

        function getPlayer() {
            return entities.find(entity => entity.category === CharacterType.Player);
        }

        function createInitialCharacters() {
            // Create the player
            spawnEntity(CharacterType.Player, 30, 30, "green", 10, 120);

            // Create the other stuff
            spawnEntity(CharacterType.Enemy, 20, 20, "red", 40, 150);
            spawnEntity(CharacterType.Enemy, 20, 20, "red", 500, 750);
        }
        createInitialCharacters();
    </script>
    <br>
</body>

</html>
