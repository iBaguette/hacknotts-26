<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            height: 100%;
        }

        canvas {
            border: 1px solid #d3d3d3;
            background-color: #5881c0;

            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: auto;

            margin: 0 auto;
            image-rendering: optimizeSpeed;             /* STOP SMOOTHING, GIVE ME SPEED  */
            image-rendering: -moz-crisp-edges;          /* Firefox                        */
            image-rendering: -o-crisp-edges;            /* Opera                          */
            image-rendering: -webkit-optimize-contrast; /* Chrome (and eventually Safari) */
            image-rendering: pixelated;                 /* Universal support since 2021   */
            image-rendering: optimize-contrast;         /* CSS3 Proposed                  */
            -ms-interpolation-mode: nearest-neighbor;   /* IE8+                           */

        }
    </style>
</head>

<body onload="startGame()">

    <script>

        var player_piece;
        var entities = [];
        var myScore;

        var x = 0;
        var y = 0;
        const direction_to_move = 1;
        const speed = 3;
        const enemySpeed = 2;

        // Background is 139
        // StartTile is the index in the map that should be the tile at 0, 0 at the start of the game
        // The start tile is drawn in the middle of the screen initially


        const t = {
            "b":       { "pos": 68,  "collidable": false, "interactable": false },
            "b2":      { "pos": 69,  "collidable": false, "interactable": false },
            "p1":      { "pos": 123, "collidable": false, "interactable": false },
            "p2":      { "pos": 124, "collidable": false, "interactable": false },
            "p3":      { "pos": 140, "collidable": false, "interactable": false },
            "p4":      { "pos": 141, "collidable": false, "interactable": false },
            "win11":   { "pos": 255, "collidable": true, "interactable": false },
            "win12":   { "pos": 256, "collidable": true, "interactable": false },
            "win13":   { "pos": 257, "collidable": true, "interactable": false },
            "win14":   { "pos": 272, "collidable": true, "interactable": false },
            "win15":   { "pos": 273, "collidable": true, "interactable": false },
            "win16":   { "pos": 274, "collidable": true, "interactable": false },
            "win21":   { "pos": 261, "collidable": true, "interactable": false },
            "win22":   { "pos": 262, "collidable": true, "interactable": false },
            "win23":   { "pos": 263, "collidable": true, "interactable": false },
            "win24":   { "pos": 278, "collidable": true, "interactable": false },
            "win25":   { "pos": 279, "collidable": true, "interactable": false },
            "win26":   { "pos": 280, "collidable": true, "interactable": false },
            "mat1":    { "pos": 126, "collidable": false, "interactable": false },
            "mat2":    { "pos": 127, "collidable": false, "interactable": false },
            "mat3":    { "pos": 128, "collidable": false, "interactable": false },
            "cracked": { "pos": 139, "collidable": false, "interactable": false },
            "slid":    { "pos": 120, "collidable": false, "interactable": false },
            "blacc":   { "pos": 111, "collidable": false, "interactable": false },
            "border":  { "pos": 18, "collidable": true,  "interactable": false },
            "r1":     { "pos": 267, "collidable": false,  "interactable": false },
            "r2":     { "pos": 268, "collidable": false,  "interactable": false },
            "r3":     { "pos": 269, "collidable": false,  "interactable": false },
        };


        const playerSpriteSheet = {
            "image": new Image("assets/neo_zero_char_01.png"),
            "sprite_dimensions": 32,
            "map": {
                "red_forward_left": [0, 0],
                "red_forward_middle": [0, 1],
                "red_forward_right": [0, 2],
                "red_back_left": [1, 0],
                "red_back_middle": [1, 1],
                "red_back_right": [1, 2],
                "red_right_left": [2, 0],
                "red_right_middle": [2, 1],
                "red_right_right": [2, 2],
                "cyborg_forward_left": [3, 0],
                "cyborg_forward_middle": [3, 1],
                "cyborg_forward_right": [3, 2],
                "cyborg_back_left": [4, 0],
                "cyborg_back_middle": [4, 1],
                "cyborg_back_right": [4, 2],
                "cyborg_right_left": [5, 0],
                "cyborg_right_middle": [5, 1],
                "cyborg_right_right": [5, 2],
            }
        }

        const startTileX = 17.5;
        const startTileY = 4.5;
        
        const WIDTH = 36;
        const HEIGHT = 15;

        // Initialise the map with background tiles
        const map = Array.from(
            { length: HEIGHT },
            () => Array(WIDTH).fill(t.b)
        );

        // Paint a repeating pattern into a rectangular area
        function paint(x, y, width, height, pattern) {
            for (let dy = 0; dy < height; dy++) {
                for (let dx = 0; dx < width; dx++) {
                    const tile = pattern[dy % pattern.length][dx % pattern[0].length];
                    map[y + dy][x + dx] = tile;
                }
            }
        }


        const patterns = {
            floor: [[t.p1, t.p2]],

            window_left_join: [
                [t.win11],
                [t.win14]
            ],

            window_centre_pane: [
                [t.win12],
                [t.win15]
            ],

            window_right_join: [
                [t.win13],
                [t.win16]
            ],

            window1: [
                [t.win11, t.win12, t.win13],
                [t.win14, t.win15, t.win16]
            ],

            window2: [
                [t.win21, t.win22, t.win23],
                [t.win24, t.win25, t.win26]
            ],

            road_marking: [
                [t.r1, t.r2, t.r3],
            ],

            mat: [[t.mat1, t.mat2, t.mat3]],
            border: [[t.border]]
        };

        // bottom section:
        paint(0, 14, 36, 1, patterns.border);
        paint(0, 4, 36, 10, patterns.floor);

        // Left and right hand windows
        paint(0, 2, 14, 2, patterns.window_centre_pane);
        paint(14, 2, 1, 2, patterns.window_right_join);

        paint(21, 2, 1, 2, patterns.window_left_join);
        paint(22, 2, 14, 2, patterns.window_centre_pane);


        /**
         * BUILD AND START ALL LOGIC HERE
         */
        function startGame() {
            myGameArea.start();
            myBackground = new background(480, 270);
            initialiseInitialCharacters();
        }


        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.frameNo = 0;
                this.interval = setInterval(updateGameArea, 20);
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function drawBasicEntityRect(entity) {
            const ctx = myGameArea.context;

            ctx.fillStyle = entity.colour;
            ctx.fillRect(
                entity.position_x,
                entity.position_y + y,
                entity.size_x,
                entity.size_y
            );
        }

        var lastFrameMovementX = 0;
        var lastFrameMovementY = 0;

        var pressedKeys = {};
        window.onkeyup = function (e) { pressedKeys[e.keyCode] = false; }
        window.onkeydown = function (e) { pressedKeys[e.keyCode] = true; }

        const gamepads = navigator.getGamepads();
        const joystick = gamepads[0];
        const deadzone = 0.25;

        function handleInput() {
            var horizontal = 0;
            var vertical = 0;
            if (!joystick || !player_piece) {
                // console.log(pressedKeys)
                if (pressedKeys[37] || pressedKeys[65]) {
                    horizontal += 1;
                }
                if (pressedKeys[39] || pressedKeys[68]) {
                    horizontal -= 1;
                }
                if (pressedKeys[87] || pressedKeys[38]) {
                    vertical += 1;
                }
                if (pressedKeys[83] || pressedKeys[40]) {
                    vertical -= 1;
                }
            } else {
                horizontal = joystick.axes[0];
                vertical = joystick.axes[1];
            };

            const entity = getPlayer();
            if (!entity) return;

            let dx = Math.abs(horizontal) > deadzone ? horizontal * speed : 0;
            let dy = Math.abs(vertical) > deadzone ? vertical * speed : 0;

            // horizoatal
            if (dx !== 0 && !checkMapCollision(
                entity,
                entity.position_x - (x + dx),
                entity.position_y - y
            )) {
                x += dx;
            } else {
                dx = 0;
            }

            // vertical
            if (dy !== 0 && !checkMapCollision(
                entity,
                entity.position_x - x,
                entity.position_y - (y + dy)
            )) {
                y += dy;
            } else {
                dy = 0;
            }

            lastFrameMovementX = dx / speed;
            lastFrameMovementY = dy / speed;

            // console.log("X:", x, "Y:", y);
        }



        function drawSprite(sheet, spriteIndex, xD, yD, scale, size = 16, flipX = false) {
            const ctx = myGameArea.context;
            const columns = Math.floor(sheet.width / size);

            const sX = (spriteIndex % columns) * size;
            const sY = Math.floor(spriteIndex / columns) * size;

            ctx.save();

            ctx.translate(xD + (flipX ? scale : 0), yD);
            ctx.scale(flipX ? -1 : 1, 1);

            ctx.drawImage(
                sheet,
                sX, sY, size, size,
                0, 0, scale, scale
            );

            ctx.restore();
        }

        const canvas = myGameArea.canvas;
        const scale = 64;

        function background(width, height) {
            this.backSheet = new Image();
            this.backSheet.src = "assets/neo_zero_tiles_and_buildings_01.png";
            this.loaded = false;
            this.backSheet.onload = () => {
                this.loaded = true;
            }

            this.playerSpriteSheet = new Image();
            this.playerSpriteSheet.src = "assets/neo_zero_char_01.png";
            this.loaded = false;
            this.playerSpriteSheet.onload = () => {
                this.loaded = true;
            }

            this.draw = function () {
                if (!this.loaded) return;
                // Centre the starting tile on the canvas
                const startScreenX = canvas.width / 2 - scale / 2;
                const startScreenY = canvas.height / 2 - scale / 2;

                // Draw each tile in the map
                for (let row = 0; row < map.length; row++) {
                    for (let col = 0; col < map[row].length; col++) {
                        const spriteIndex = map[row][col].pos;

                        const screenX = startScreenX + (col - startTileX) * scale;
                        const screenY = startScreenY + (row - startTileY) * scale;

                        drawSprite(
                            this.backSheet,
                            spriteIndex,
                            screenX,
                            screenY + y,
                            scale
                        );
                    }
                }
            };
        }

        function getRealCoordinateFromGrid(x, y) {
            const startScreenX = canvas.width / 2 - scale / 2;
            const startScreenY = canvas.height / 2 - scale / 2;

            const dx = x * scale + startScreenX;
            const dy = y * scale + startScreenY;
            
            return {x: dx, y: dy};
        }

        walkingState = 0;
        count = 0;
        isFacingUp = false;

        function updateGameArea() {
            var x, height, gap, minHeight, maxHeight, minGap, maxGap;

            myGameArea.clear();

            doEntityMovementCalcs();

            myBackground.draw();

            for (const entity of entities) {
                if (entity.category === CharacterType.Player) {
                    drawSprite(
                        myBackground.playerSpriteSheet,
                        walkingState,
                        entity.position_x - this.x,
                        entity.position_y,
                        64,
                        32,
                        lastFrameMovementX > 0
                    );
                } else if (entity.category === CharacterType.Enemy) {
                    var fOffset = 9;
                    var flipX = false;
                    if (entity.direction == "right") {
                        flipX = false;
                        fOffset = 15;
                    }
                    if (entity.direction == "left") {
                        flipX = true;
                        fOffset = 15;
                    }
                    if (entity.direction == "forward") {
                        fOffset = 9;
                    }
                    if (entity.direction == "back") {
                        fOffset = 12;
                    }
                    console.log(entity.frame, fOffset, entity.frame + fOffset);
                    drawSprite(
                        myBackground.playerSpriteSheet,
                        entity.frame + fOffset,
                        entity.position_x,
                        entity.position_y + this.y,
                        64,
                        32,
                        flipX
                    );


                }
                
                else {
                    drawBasicEntityRect(entity);
                }
            }

            // loops
            if (lastFrameMovementX == 0 && lastFrameMovementY == 0) {
                count = 0;
                (isFacingUp) ? walkingState = 4 : walkingState = 1;
            } else {
                isFacingUp = false; 
                if (lastFrameMovementY == 1) {
                    // from 3-5
                    walkingState = 3 + Math.floor(count / 5) % 3;
                    isFacingUp = true;
                } else if (lastFrameMovementY == -1) {
                    // from 0-2
                    walkingState = Math.floor(count / 5) % 3;
                } else if (lastFrameMovementX == 1) {
                    // from 6-8
                    walkingState = 6 + Math.floor(count / 5) % 3;
                } else if (lastFrameMovementX == -1) {
                    // from 6-8
                    walkingState = 6 + Math.floor(count / 5) % 3;
                }
            }
            count += 1;

            handleInput();
        }

        function everyinterval(n) {
            if ((myGameArea.frameNo / n) % 1 == 0) { return true; }
            return false;
        }

        /**
         * if the new position calc'd would collide with something that shouldnt be collided with,
         */
        function checkMapCollision(entity, newX, newY) {
            for (let row = 0; row < map.length; row++) {
                for (let col = 0; col < map[row].length; col++) {

                    if (!map[row][col].collidable) continue;

                    const tileX = canvas.width / 2 - scale / 2 + (col - startTileX) * scale;

                    const tileY = canvas.height / 2 - scale / 2 + (row - startTileY) * scale;

                    if (
                        newX < tileX + scale &&
                        newX + entity.size_x > tileX &&
                        newY < tileY + scale &&
                        newY + entity.size_y > tileY
                    ) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Manage all characters/entities in the world rn
        /**
         * definition for different character types
         */
        const CharacterType = {
            Player: "player",
            Enemy: "enemy",
            NPC: "npc",
            Item: "item",
            Obstacle: "obstacle",
        }

        var current_entity_id = 0;
        function spawnEntity(category = CharacterType.Item, size_x, size_y, colour = "red", position_x, position_y, collidable = true, patrol_x = 0, patrol_y = 0) {
            // Player must be singleton
            if (category === CharacterType.Player) {
                if (player_piece !== undefined) {
                    window.alert("Can't spawn a second player");
                    return;
                }
            }

            if (category === CharacterType.Enemy) {
                // INIT FOR ENEMY

                const position = getRealCoordinateFromGrid(position_x, position_y);
                position_x = position.x;
                position_y = position.y;

                const patrol = getRealCoordinateFromGrid(patrol_x, patrol_y);
                patrol_x = patrol.x;
                patrol_y = patrol.y;

            }
            
            console.log(`Spawning entity of type ${category} at (${position_x}, ${position_y})`);
            // else create the new
            // let new_char = new component(size_x, size_y, colour, position_x, position_y);

            const constructed_character = {
                id: current_entity_id++,
                category: category,
                size_x: size_x, 
                size_y: size_y,
                colour: colour,
                position_x: position_x,
                position_y: position_y,
                starting_x: position_x,
                starting_y: position_y,
                patrol_x: patrol_x,
                patrol_y: patrol_y,
                collidable: collidable,
                frame: 0,
                counter: 0,
                direction: "left"
            };

            entities.push(constructed_character);
            // console.lwog(`Spawned new character with id: ${current_entity_id}`);

            // set singleton 
            if (category === CharacterType.Player) {
                console.log("Assigned player piece");
                player_piece = constructed_character;
            }

            console.log(`Created entity #${current_entity_id}`);
            console.log(constructed_character);
            return constructed_character;
        }

        function getPlayer() {
            return entities.find(entity => entity.category === CharacterType.Player);
        }

        function initialiseInitialCharacters() {
            // Create the player
            console.log(`Spawning player at ${canvas.width}`);
            spawnEntity(CharacterType.Player, 30, 30, "green", (canvas.width - 30) / 2, (canvas.height - 30) / 2);

            // Create the other stuff
            spawnEntity(CharacterType.Enemy, 50, 80, "red", 1, 1, false, 2, 1);
            // spawnEntity(CharacterType.Enemy, 50, 80, "red", position_x = 500, position_y = 500, patrol_x = 100, patrol_y = 100);
            // spawnEntity(CharacterType.Enemy, 20, 20, "red", 500, 750);
        }


        function doEntityMovementCalcs() {
            for (const entity of entities) {
                if (entity.category === CharacterType.Enemy) {
                    // Difference between current position and target
                    const cX = entity.position_x - entity.patrol_x;
                    const cY = entity.position_y - entity.patrol_y;

                    // Distance to target
                    const distance = Math.sqrt(cX * cX + cY * cY);

                    if (distance <= 5) {
                        console.log("SWITCH");

                        // Swap the current target and starting point
                        const oldTargetX = entity.patrol_x;
                        const oldTargetY = entity.patrol_y;

                        entity.patrol_x = entity.starting_x;
                        entity.patrol_y = entity.starting_y;

                        entity.starting_x = oldTargetX;
                        entity.starting_y = oldTargetY;

                        continue;
                    }

                    // Move towards the target
                    entity.position_x -= (cX / distance) * enemySpeed;
                    entity.position_y -= (cY / distance) * enemySpeed;
                
                    // Which way should the entity be facing
                    const moveX = -(cX / distance);
                    const moveY = -(cY / distance);

                    if (Math.abs(moveX) > Math.abs(moveY)) {
                        entity.direction = moveX < 0 ? "left" : "right";
                    } else {
                        entity.direction = moveY < 0 ? "back" : "forward";
                    }
                    // Increment animation counter
                    entity.counter += 1;

                    if (entity.counter >= 10) {
                        entity.counter = 0;
                        entity.frame += 1
                        if (entity.frame >= 3) {
                            entity.frame = 0;
                        }
                    }

                }
            }
        }

    </script>
    <br>
</body>

</html>
