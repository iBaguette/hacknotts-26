<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            height: 100%;
        }

        canvas {
            border: 1px solid #d3d3d3;
            background-color: #5881c0;

            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: 100vw;
            height: auto;

            margin: 0 auto;
            image-rendering: pixelated;
        }
    </style>
</head>

<body onload="startGame()">

    <script>

        var player_piece;
        var entities = [];
        var myScore;

        var x = 0;
        var y = 0;
        const direction_to_move = 1;
        const speed = 1;

        // Background is 139
        // StartTile is the index in the map that should be the tile at 0, 0 at the start of the game
        // The start tile is drawn in the middle of the screen initially

        const t = {
            "b": 68,
            "b2": 69,
            "p1": 123,
            "p2": 124,
            "p3": 140,
            "p4": 141,
            "win11": 255,
            "win12": 256,
            "win13": 257,
            "win14": 272,
            "win15": 273,
            "win16": 274,
            "win21": 261,
            "win22": 262,
            "win23": 263,
            "win24": 278,
            "win25": 279,
            "win26": 280,
            "mat1": 126,
            "mat2": 127,
            "mat3": 128,
            "cracked": 139,
            "slid": 120,
            "blacc": 111
        }

        const startTileX = 5;
        const startTileY = 2;
        const map = [
            [t.b, t.b, t.b, t.b, t.b, t.b, t.b, t.b],
            [t.win11, t.win12, t.win13, t.win11, t.win12, t.win13, t.b, t.b, t.b, t.win21, t.win22, t.win23,],
            [t.win14, t.win15, t.win16, t.win14, t.win15, t.win16, t.mat1, t.mat2, t.mat3, t.win24, t.win25, t.win26,],
            [t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2],
            [t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2],
            [t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2],
            [t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2, t.p1, t.p2],
        ];

        function startGame() {
            myGameArea.start();
            myBackground = new background(480, 270);
        }


        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.frameNo = 0;
                this.interval = setInterval(updateGameArea, 20);
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        function drawEntity(entity) {
            const ctx = myGameArea.context;

            ctx.fillStyle = entity.colour;
            ctx.fillRect(
                entity.position_x,
                entity.position_y,
                entity.size_x,
                entity.size_y
            );
        }
        var pressedKeys = {};
        window.onkeyup = function(e) { pressedKeys[e.keyCode] = false; }
        window.onkeydown = function(e) { pressedKeys[e.keyCode] = true; }

        function handleJoystick() {
            const gamepads = navigator.getGamepads();
            const joystick = gamepads[0];
            var horizontal = 0;
            var vertical = 0;
            if (!joystick || !player_piece) {
                console.log(pressedKeys)
                if (pressedKeys[37] || pressedKeys[65]) {
                    horizontal += 1;
                }
                if (pressedKeys[39] || pressedKeys[68]) {
                    horizontal -= 1;
                }
                if (pressedKeys[87] || pressedKeys[38]) {
                    vertical += 1;
                }
                if (pressedKeys[83] || pressedKeys[40]) {
                    vertical -= 1;
                }
            } else {
                horizontal = joystick.axes[0];
                vertical = joystick.axes[1];
            };


            const deadzone = 0.25;

            if (Math.abs(horizontal) > deadzone) {
                x += horizontal * speed;
            }

            if (Math.abs(vertical) > deadzone) {
                y += vertical * speed;
            }

            console.log("X:", x, "Y:", y);
        }


        function drawSprite(sheet, spriteIndex, xD, yD, scale) {
            const size = 16;
            let columns = Math.floor(sheet.width / size);
            if (columns <= 0) columns = 0;

            // Convert single index into x and y on the sprite sheet
            const sX = (spriteIndex % columns) * size;
            const sY = Math.floor(spriteIndex / columns) * size;

            // Draw 
            ctx = myGameArea.context;
            ctx.drawImage(
                sheet,
                sX, sY, size, size, // Source - where to crop from the sheet
                xD + x, yD + y, scale, scale // Destination - where to draw it
            );
        }

        const canvas = myGameArea.canvas;

        function background(width, height) {
            const scale = 64;
            this.backSheet = new Image();
            this.backSheet.src = "assets/neo_zero_tiles_and_buildings_01.png";
            this.loaded = false;
            this.backSheet.onload = () => {
                this.loaded = true;
            }

            this.playerSpriteSheet = new Image();
            this.playerSpriteSheet.src = "assets/neo_zero_char_01.png";
            this.loaded = false;
            this.playerSpriteSheet.onload = () => {
                this.loaded = true;
            }

            this.draw = function () {
                if (!this.loaded) return;
                // Centre the starting tile on the canvas
                const startScreenX = canvas.width / 2 - scale / 2;
                const startScreenY = canvas.height / 2 - scale / 2;

                // Draw each tile in the map
                for (let row = 0; row < map.length; row++) {
                    for (let col = 0; col < map[row].length; col++) {
                        const spriteIndex = map[row][col];

                        const screenX = startScreenX + (col - startTileX) * scale;
                        const screenY = startScreenY + (row - startTileY) * scale;

                        drawSprite(
                            this.backSheet,
                            spriteIndex,
                            screenX,
                            screenY,
                            scale
                        );
                    }
                }

                // Draw the player in the middle of the screen
                const player = getPlayer();
                if (player) {
                    drawSprite(
                        this.playerSpriteSheet,
                        player.spriteIndex,
                        startScreenX,
                        startScreenY,
                        scale
                    );
                }
            };
        }

        function updateGameArea() {
            var x, height, gap, minHeight, maxHeight, minGap, maxGap;
            
            myGameArea.clear();
            myGameArea.frameNo += 1;
            if (myGameArea.frameNo == 1 || everyinterval(150)) {
                x = myGameArea.canvas.width;
                minHeight = 20;
                maxHeight = 200;
                height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                minGap = 50;
                maxGap = 200;
                gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);
            }
            
            doEntityMovementCalcs();
            for (i = 0; i < entities.length; i += 1) {
                entities[i].x += -1;
            }

            myBackground.draw();
            
            for (const entity of entities) {
                drawEntity(entity);
            }



            handleJoystick();
        }

        function everyinterval(n) {
            if ((myGameArea.frameNo / n) % 1 == 0) { return true; }
            return false;
        }

        // Manage all characters/entities in the world rn
        /**
         * definition for different character types
         */
        const CharacterType = {
            Player: "player",
            Enemy: "enemy",
            NPC: "npc",
            Item: "item",
            Obstacle: "obstacle",
        }

        var entities = [];
        var current_entity_id = 0;
        function spawnEntity(category = CharacterType.Item, size_x, size_y, colour, position_x, position_y, collidable = true) {
            // Player must be singleton
            if (category === CharacterType.Player) {
                if (player_piece !== undefined) {
                    window.alert("Can't spawn a second player");
                    return;
                }
            }
            console.log(`Spawning entity of type ${category} at (${position_x}, ${position_y})`);
            // else create the new
            // let new_char = new component(size_x, size_y, colour, position_x, position_y);

            const constructed_character = {
                id: current_entity_id++,
                category: category,
                size_x: size_x,
                size_y: size_y,
                colour: colour,
                position_x: position_x,
                position_y: position_y,
                collidable: collidable
            };

            entities.push(constructed_character);
            // console.lwog(`Spawned new character with id: ${current_entity_id}`);

            // set singleton 
            if (category === CharacterType.Player) {
                console.log("Assigned player piece");
                player_piece = constructed_character;
            }

            console.log(`Created entity #${current_entity_id}`);
            console.log(constructed_character);
            return constructed_character;
        }

        function getPlayer() {
            return entities.find(entity => entity.category === CharacterType.Player);
        }

        function initialiseInitialCharacters() {
            // Create the player
            console.log(`Spawning player at ${canvas.width}`);
            spawnEntity(CharacterType.Player, 30, 30, "green", (canvas.width / 2), (canvas.height / 2));
            // spawnEntity(CharacterType.Player, 30, 30, "green", (canvas.width*3), (canvas.height*3));

            // Create the other stuff
            spawnEntity(CharacterType.Enemy, 20, 20, "red", 0, 150);
            spawnEntity(CharacterType.Enemy, 20, 20, "red", 500, 750);
        }
        initialiseInitialCharacters();

        function doEntityMovementCalcs() {
            for (const entity of entities) {
                if (entity.category === CharacterType.Enemy) {
                    entity.position_x += direction_to_move;
                }
            }
        }
        
    </script>
    <br>
</body>

</html>
